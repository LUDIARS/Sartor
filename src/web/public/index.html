<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sartor — 予算内コーディネート</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="shell">
      <header class="app-header">
        <p class="eyebrow">SARTOR / STEP 1</p>
        <h1>今日の装いを、予算の中で。</h1>
        <p>Uniqlo・GU の集積商品から、ケア条件まで考慮して提案します。</p>
      </header>

      <p id="status-message" class="status" role="status" aria-live="polite"></p>

      <section id="profile-panel" class="panel">
        <div class="section-heading">
          <p class="step">01</p>
          <div><h2>プロフィール</h2><p>この端末の SQLite にのみ保存します。</p></div>
        </div>
        <form id="profile-form" class="form-grid">
          <label>表示名 <input name="displayName" maxlength="100" autocomplete="nickname"></label>
          <label>性別区分 <select name="gender" required><option value="WOMEN">WOMEN</option><option value="MEN">MEN</option><option value="UNISEX">UNISEX</option></select></label>
          <label>年代 <select name="ageBand" required><option value="10s">10s</option><option value="20s" selected>20s</option><option value="30s">30s</option><option value="40s">40s</option><option value="50s">50s</option><option value="60s+">60s+</option></select></label>
          <label>身長 cm <input name="heightCm" type="number" min="80" max="260" inputmode="numeric"></label>
          <label>トップスサイズ <input name="topSize" required maxlength="50" placeholder="例: M"></label>
          <label>ボトムスサイズ <input name="bottomSize" required maxlength="50" placeholder="例: 76cm / M"></label>
          <label class="full-width">体型メモ <textarea name="bodyNotes" maxlength="1000" placeholder="例: 肩幅が広め"></textarea></label>
          <label>好きな色 <input name="favColors" maxlength="300" placeholder="カンマ区切り: ネイビー, 白"></label>
          <label>避けたい色 <input name="avoidColors" maxlength="300" placeholder="カンマ区切り: 蛍光色"></label>
          <label>NG 素材 <input name="ngMaterials" maxlength="300" placeholder="カンマ区切り: ウール"></label>
          <label>月の洋服予算 JPY <input name="monthlyBudgetJpy" type="number" min="1" value="30000" required inputmode="numeric"></label>
          <fieldset class="toggles full-width"><legend>ケアの希望</legend><label><input name="usesDryer" type="checkbox"> 乾燥機を使う</label><label><input name="avoidColorBleed" type="checkbox"> 色落ちを避けたい</label></fieldset>
          <div class="form-action full-width"><button type="submit">プロフィールを保存して進む</button></div>
        </form>
      </section>

      <section id="vector-panel" class="panel" hidden>
        <div class="section-heading"><p class="step">02</p><div><h2>装いのベクトル</h2><p>年代と TPO の既定値から、好みを調整します。</p></div></div>
        <form id="vector-form" class="form-grid">
          <label>年代 <select name="ageBand" id="vector-age-band"></select></label>
          <label>TPO <select name="tpo" id="vector-tpo"></select></label>
          <fieldset class="full-width"><legend>スタイル軸（複数選択・重み 1〜3）</legend><div id="style-weights" class="style-weights"></div></fieldset>
          <label>季節（任意）<select name="season" id="vector-season"><option value="">指定しない</option></select></label>
          <label>色調（任意）<select name="colorTone" id="vector-color-tone"><option value="">指定しない</option></select></label>
          <div class="form-action full-width"><button type="submit">予算を決める</button></div>
        </form>
      </section>

      <section id="budget-panel" class="panel" hidden>
        <div class="section-heading"><p class="step">03</p><div><h2>今回の予算と対象</h2><p>上限金額と、コーデに含めたいアイテムを指定します。</p></div></div>
        <form id="budget-form" class="form-grid">
          <label>コーデ上限 JPY <input name="budgetJpy" type="number" min="1" required inputmode="numeric"></label>
          <fieldset class="full-width"><legend>対象アイテム種別</legend><div class="kind-choices"><label><input type="checkbox" name="kinds" value="tops" checked> トップス</label><label><input type="checkbox" name="kinds" value="bottoms" checked> ボトムス</label><label><input type="checkbox" name="kinds" value="outer"> アウター</label><label><input type="checkbox" name="kinds" value="onepiece"> ワンピース</label><label><input type="checkbox" name="kinds" value="shoes"> シューズ</label><label><input type="checkbox" name="kinds" value="accessory"> 小物</label></div></fieldset>
          <div class="form-action full-width"><button type="submit">3 案を提案する</button></div>
        </form>
      </section>

      <section id="proposals" class="panel" hidden aria-live="polite">
        <div class="section-heading"><p class="step">04</p><div><h2>3 つの提案</h2><p>乾燥機・色落ちの注意も確認してから、人が判断します。</p></div></div>
        <div id="proposal-options" class="proposal-options"></div>
      </section>

      <section id="history-panel" class="panel" hidden>
        <div class="section-heading"><p class="step">05</p><div><h2>提案履歴</h2><p>採用した案はコーデ帳としてここに残ります。</p></div></div>
        <div id="proposal-history"></div>
      </section>
    </main>

    <template id="option-template">
      <article class="proposal-option">
        <div class="decision-controls">
          <button type="button" data-decision="accept">採用</button>
          <button type="button" data-decision="hold">保留</button>
          <button type="button" data-decision="reject">却下</button>
        </div>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
